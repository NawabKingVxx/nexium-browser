name: Unzip Nexium Browser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip nexium-browser.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "nexium-browser.zip" -d extracted

      - name: Show Extracted Files
        run: |
          find extracted -type f

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted

          git diff --cached --quiet || git commit -m "Extract nexium-browser.zip"

          git push
